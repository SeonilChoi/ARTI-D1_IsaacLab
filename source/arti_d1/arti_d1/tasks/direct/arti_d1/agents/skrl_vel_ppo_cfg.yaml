# ARTI-D1 velocity walk (arti_d1_vel_env.py), PPO after microduck_rl MicroduckRlCfg (rsl_rl):
# actor / critic 512-256-128 elu, init std 1.0, obs normalization, clip 0.2, entropy 0.01, 5 epochs x 4 mini-batches,
# lr 1e-3 adaptive (kl 0.01), gamma 0.99, lambda 0.95, value loss 1.0, grad norm 1.0, 24 steps per env per iteration.
seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        # asymmetric critic: env "critic" state (noise-free obs + base lin vel + foot height / air time / contact)
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.0e-03
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  kl_threshold: 0.0
  time_limit_bootstrap: True
  experiment:
    directory: "arti_d1_vel_walk"
    experiment_name: ""
    write_interval: 240
    checkpoint_interval: 6000   # = 250 iterations (microduck save_interval)

trainer:
  class: SequentialTrainer
  timesteps: 240000   # 10000 iterations x 24 (microduck gait budget 4000-6000 iterations)
  environment_info: log
